services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wingman
      POSTGRES_PASSWORD: wingman
      POSTGRES_DB: wingman
    ports:
      - "5432:5432"
    volumes:
      - wingman_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  wingman_pg:
